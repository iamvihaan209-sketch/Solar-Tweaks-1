name: Build Solar Tweaks for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - name: Check Node
        run: |
          which node
          node --version
          npm --version
          uname -m
          sw_vers

      - name: Install dependencies
        run: |
          npm ci

      - name: Build Solar Tweaks
        run: |
          NODE_OPTIONS=--openssl-legacy-provider npm run build -- --mac

      - name: List build output
        run: |
          echo "Build output:"
          find dist_electron -maxdepth 2 -type f -print 2>/dev/null || true
          find dist -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Tweaks-macOS
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.blockmap
          if-no-files-found: warn
